<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Quick blackout panel preview">
  <!-- Self-contained artwork: fixed palette reads identically in light and dark themes because detail images render as an <img> and do not inherit CSS variables. No text or font-family. -->
  <rect x="0" y="0" width="640" height="300" rx="16" fill="#eef2f9"/>

  <!-- header: title + subtitle bars -->
  <rect x="32" y="40" width="196" height="16" rx="8" fill="#26324a"/>
  <rect x="32" y="66" width="340" height="9" rx="4.5" fill="#8c99b3"/>

  <!-- section label -->
  <rect x="32" y="98" width="104" height="9" rx="4.5" fill="#8c99b3"/>

  <!-- selected mode card (accent) -->
  <rect x="32" y="118" width="360" height="52" rx="10" fill="#dce7fb" stroke="#3b6fd4" stroke-width="2"/>
  <rect x="48" y="132" width="150" height="11" rx="5.5" fill="#26324a"/>
  <rect x="48" y="151" width="268" height="8" rx="4" fill="#6c7a96"/>

  <!-- second mode card -->
  <rect x="32" y="178" width="360" height="46" rx="10" fill="#ffffff" stroke="#bcc7db" stroke-width="1.5"/>
  <rect x="48" y="192" width="120" height="10" rx="5" fill="#3b475f"/>
  <rect x="48" y="209" width="220" height="7" rx="3.5" fill="#97a3ba"/>

  <!-- third mode card -->
  <rect x="32" y="232" width="360" height="40" rx="10" fill="#ffffff" stroke="#bcc7db" stroke-width="1.5"/>
  <rect x="48" y="246" width="96" height="9" rx="4.5" fill="#3b475f"/>

  <!-- wake time label + input -->
  <rect x="416" y="98" width="132" height="9" rx="4.5" fill="#8c99b3"/>
  <rect x="416" y="118" width="192" height="46" rx="8" fill="#ffffff" stroke="#bcc7db" stroke-width="1.5"/>
  <rect x="432" y="136" width="54" height="12" rx="6" fill="#26324a"/>

  <!-- primary action button -->
  <rect x="416" y="182" width="192" height="44" rx="8" fill="#3b6fd4"/>
  <rect x="470" y="198" width="84" height="12" rx="6" fill="#ffffff" opacity="0.95"/>

  <!-- wake hint bar -->
  <rect x="416" y="240" width="192" height="8" rx="4" fill="#8c99b3"/>
  <rect x="416" y="256" width="140" height="8" rx="4" fill="#b3bdd0"/>
</svg>
