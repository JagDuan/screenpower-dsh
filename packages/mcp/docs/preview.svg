<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="ScreenPower MCP tools preview">
  <!-- Self-contained artwork: fixed palette reads identically in light and dark themes because detail images render as an <img> and do not inherit CSS variables. No text or font-family. -->
  <rect x="0" y="0" width="640" height="300" rx="16" fill="#eef2f9"/>

  <!-- header bars -->
  <rect x="32" y="40" width="240" height="16" rx="8" fill="#26324a"/>
  <rect x="32" y="66" width="420" height="9" rx="4.5" fill="#8c99b3"/>

  <!-- tool row 1 (accent) -->
  <rect x="32" y="104" width="576" height="40" rx="8" fill="#dce7fb" stroke="#3b6fd4" stroke-width="2"/>
  <circle cx="52" cy="124" r="6" fill="#3b6fd4"/>
  <rect x="70" y="115" width="210" height="10" rx="5" fill="#26324a"/>
  <rect x="70" y="132" width="140" height="7" rx="3.5" fill="#6c7a96"/>

  <!-- tool row 2 -->
  <rect x="32" y="152" width="576" height="40" rx="8" fill="#ffffff" stroke="#bcc7db" stroke-width="1.5"/>
  <circle cx="52" cy="172" r="6" fill="#6c7a96"/>
  <rect x="70" y="163" width="240" height="10" rx="5" fill="#3b475f"/>
  <rect x="70" y="180" width="160" height="7" rx="3.5" fill="#97a3ba"/>

  <!-- tool row 3 -->
  <rect x="32" y="200" width="576" height="40" rx="8" fill="#ffffff" stroke="#bcc7db" stroke-width="1.5"/>
  <circle cx="52" cy="220" r="6" fill="#6c7a96"/>
  <rect x="70" y="211" width="190" height="10" rx="5" fill="#3b475f"/>
  <rect x="70" y="228" width="120" height="7" rx="3.5" fill="#97a3ba"/>

  <!-- tool row 4 -->
  <rect x="32" y="248" width="576" height="40" rx="8" fill="#ffffff" stroke="#bcc7db" stroke-width="1.5"/>
  <circle cx="52" cy="268" r="6" fill="#6c7a96"/>
  <rect x="70" y="259" width="200" height="10" rx="5" fill="#3b475f"/>
  <rect x="70" y="276" width="130" height="7" rx="3.5" fill="#97a3ba"/>
</svg>
