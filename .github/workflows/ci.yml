name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every JavaScript file
        shell: pwsh
        run: |
          $files = @(
            'shared/screenpower-core.js',
            'packages/mcp/server.js',
            'packages/ui/index.js',
            'packages/ui/client.js',
            'scripts/install.mjs',
            'scripts/screenpower-dsh-install.mjs',
            'scripts/smoke-mcp.mjs'
          )
          foreach ($f in $files) {
            node --check $f
            if ($LASTEXITCODE -ne 0) { throw "node --check failed: $f" }
            Write-Host "ok  $f"
          }

      - name: Validate every JSON file
        shell: pwsh
        run: |
          # PowerShell 5.1's ConvertFrom-Json cannot parse the empty-string key ""
          # that npm lockfiles use, so validate with Node instead.
          $files = Get-ChildItem -Path . -Recurse -Filter *.json |
            Where-Object { $_.FullName -notmatch 'node_modules' }
          foreach ($f in $files) {
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "invalid JSON: $($f.FullName)" }
            Write-Host "ok  $($f.FullName.Substring($PWD.Path.Length + 1))"
          }

      - name: Validate YAML files
        shell: pwsh
        run: |
          # Fail fast on tab indentation, which YAML forbids.
          $files = Get-ChildItem -Path . -Recurse -Include *.yml,*.yaml |
            Where-Object { $_.FullName -notmatch 'node_modules' }
          foreach ($f in $files) {
            $bad = Select-String -Path $f.FullName -Pattern "`t"
            if ($bad) { throw "tab indentation in $($f.FullName) (line $($bad[0].LineNumber))" }
            Write-Host "ok  $($f.FullName.Substring($PWD.Path.Length + 1))"
          }

      - name: MCP smoke test
        shell: pwsh
        run: node scripts/smoke-mcp.mjs .

      - name: Pack the tarball
        shell: pwsh
        run: npm pack --dry-run

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
