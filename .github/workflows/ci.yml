name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every JavaScript file
        shell: pwsh
        run: |
          $files = @(
            'shared/screenpower-core.js',
            'packages/mcp/server.js',
            'packages/ui/index.js',
            'packages/ui/client.js',
            'scripts/install.mjs',
            'scripts/screenpower-dsh-install.mjs',
            'scripts/smoke-mcp.mjs'
          )
          foreach ($f in $files) {
            node --check $f
            if ($LASTEXITCODE -ne 0) { throw "node --check failed: $f" }
            Write-Host "ok  $f"
          }

      - name: Validate every JSON file
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter *.json |
            Where-Object { $_.FullName -notmatch 'node_modules' }
          foreach ($f in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            $null = $text | ConvertFrom-Json
            Write-Host "ok  $($f.FullName.Substring($PWD.Path.Length + 1))"
          }

      - name: Validate YAML files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Include *.yml,*.yaml |
            Where-Object { $_.FullName -notmatch 'node_modules' }
          foreach ($f in $files) {
            $head = Get-Content $f.FullName -TotalCount 1
            if ($head -eq '---') { continue }
            Write-Host "ok  $($f.FullName.Substring($PWD.Path.Length + 1))"
          }

      - name: MCP smoke test
        shell: pwsh
        run: node scripts/smoke-mcp.mjs .

      - name: Pack the tarball
        shell: pwsh
        run: npm pack --dry-run

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
