name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build release assets and publish a GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the npm tarball
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          npm pack --pack-destination release-assets
          Get-ChildItem release-assets | ForEach-Object { Write-Host "asset: $($_.Name) $($_.Length) bytes" }

      - name: Write the release notes
        shell: pwsh
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:TAG
          $lines = @(
            "## ScreenPower DSH $tag"
            ''
            'One-click blackout for DeepSeek Harness.'
            ''
            '### Install'
            ''
            '```powershell'
            'git clone https://github.com/JagDuan/screenpower-dsh.git'
            'cd screenpower-dsh'
            'node scripts/install.mjs'
            '```'
            ''
            'Or download the tarball from the assets below, extract it and run `node scripts/install.mjs`.'
            ''
            '### Assets'
            ''
            '- `screenpower-dsh-*.tgz` - the npm tarball (contains the UI bundle, the MCP server and the native Windows tool)'
          )
          Set-Content -Path release-notes.md -Value $lines -Encoding utf8

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:TAG
          # `gh release create` fails when a release for this tag already
          # exists, which happens when a tag is moved and re-pushed. Editing
          # the existing release keeps the tag and the assets in sync.
          $existing = gh release view $tag --json tagName --jq '.tagName' 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "release for $tag already exists - updating it"
            gh release edit $tag --title "ScreenPower DSH $tag" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
            Get-ChildItem release-assets -Filter *.tgz | ForEach-Object {
              gh release upload $tag $_.FullName --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
            }
          }
          else {
            gh release create $tag --title "ScreenPower DSH $tag" --notes-file release-notes.md "release-assets/*.tgz" --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
          Write-Host "release published for $tag"
