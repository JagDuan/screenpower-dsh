name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build release assets and publish a GitHub Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the npm tarball
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          npm pack --pack-destination release-assets
          Get-ChildItem release-assets | ForEach-Object { Write-Host "asset: $($_.Name) $($_.Length) bytes" }

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:TAG
          $notes = @"
          ## ScreenPower DSH $tag

          One-click blackout for DeepSeek Harness.

          ### Install

          ```powershell
          npm install -g screenpower-dsh
          screenpower-dsh-install
          ```

          Offline package: download `screenpower-dsh-*.tgz` from the assets below, extract it and run
          `node scripts/install.mjs`.

          ### Assets

          - `screenpower-dsh-*.tgz` - the npm tarball (contains the UI bundle, the MCP server and the native Windows tool)
          "@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create $tag `
            --title "ScreenPower DSH $tag" `
            --notes-file release-notes.md `
            release-assets/*.tgz `
            --verify-tag

      - name: Upload the release notes
        if: always()
        shell: pwsh
        run: echo "release notes: release-notes.md"
